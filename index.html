<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>裕信零服財報儀表板</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#f4f4f2;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--line:#e2e1dc;--accent:#2a78d6;--bad:#b4292a}
@media (prefers-color-scheme: dark){:root{--bg:#121211;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--line:#33332f;--accent:#3987e5;--bad:#f08a89}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;padding:16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
h1{font-size:20px;margin:0 0 6px}
p{color:var(--ink2);font-size:14px;margin:0 0 18px}
label{font-size:13px;color:var(--ink2);display:block;margin-bottom:6px}
input{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:14px;width:100%;font:inherit;font-size:16px;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:20px;margin-top:10px;font-size:14px;color:var(--bad)}
</style></head>
<body>
<form class="box" id="f" autocomplete="off">
  <h1>裕信零服財報儀表板</h1>
  <p>內部資料，請輸入密碼開啟。</p>
  <label for="pw">密碼</label>
  <input id="pw" type="password" autofocus>
  <button id="go" type="submit">開啟</button>
  <div id="msg" role="alert"></div>
</form>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},k,u(P.c)));
  try{sessionStorage.setItem('ys-pw',pw);}catch(e){}
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),b=document.getElementById('go'),m=document.getElementById('msg');
f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;m.textContent='解密中…';
  try{await open(document.getElementById('pw').value.trim());}catch(err){m.textContent='密碼不正確，請再試一次。';b.disabled=false;}});
(async()=>{let s=null;try{s=sessionStorage.getItem('ys-pw');}catch(e){} if(s){try{await open(s);}catch(e){}}})();
</script>
